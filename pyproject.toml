[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "techspark"
version = "0.1.0"
description = "Tech Spark — automated collation & drafting tool for the ScottishPower/Iberdrola digital & IT innovation newsletter."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "click>=8.1.7",
    "pydantic>=2.7.0",
    "jinja2>=3.1.3",
    "python-dateutil>=2.9.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
techspark = "techspark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
techspark = ["py.typed"]
